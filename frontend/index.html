<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>DevOps Project Frontend</title>
<style>
body { font-family: sans-serif; text-align: center; margin-top: 80px; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
#result { margin-top: 20px; font-size: 18px; color: #333; }
</style>
</head>
<body>
<h1>DevOps Resume Project</h1>
<button onclick="fetchData()">Call Backend API</button>
<div id="result"></div>

<script>
async function fetchData() {
const backendUrl = window.BACKEND_URL || 'http://localhost:5000';
const res = await fetch(backendUrl + '/api/data');
const data = await res.json();
document.getElementById('result').innerText =
`${data.message} (served by ${data.hostname} at ${data.timestamp})`;
}
</script>
</body>
</html>
